[project]
name = "stanford-dogs"
version = "0.1.0"
description = "Fine-grained dog breed classification and serving engine using PyTorch, ONNX Runtime, and FastAPI"
readme = "README.md"
authors = [
    { name = "Eman Abdelhaleem", email = "emanabdelhaleem4@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.5",
    "onnxruntime>=1.32.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.1",
]

[project.optional-dependencies]
onnx = [
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "kaggle>=2.2.4",
    "matplotlib>=3.11.2",
    "notebook>=7.6.3",
    "opencv-python>=5.0.0.93",
    "seaborn>=0.13.2",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu126", marker= "sys_platform == 'win32'" },
] 
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cu126", marker= "sys_platform == 'win32'" },
]

[tool.fastapi]
    entrypoint = "app:app"
