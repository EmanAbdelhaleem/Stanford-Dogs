[project]
name = "stanford-dogs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Eman Abdelhaleem", email = "emanabdelhaleem4@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[project.scripts]
stanford-dogs = "stanford_dogs:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "kaggle>=2.2.4",
    "matplotlib>=3.11.2",
    "notebook>=7.6.3",
    "opencv-python>=5.0.0.93",
    "seaborn>=0.13.2",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }